name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from package.json packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Verify dist (skip if no prior gen artifacts)
        run: |
          if [ -f dist/manifest.json ]; then
            pnpm fc verify
          else
            echo "No dist/manifest.json — skipping verify (gen runs on deploy hosts)."
          fi
