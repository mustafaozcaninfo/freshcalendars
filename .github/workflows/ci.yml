name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same pull request cancels the older run. Pushes to main each get their own
# group: cancelling there held every story back until pushes stopped, and auto-publish only
# waits for the run of the newest commit anyway.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from package.json packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      # Daily puzzle pages vs the official data saved with them (offline): a wrong answer never publishes.
      - name: Puzzle answers vs official data
        run: pnpm news:puzzle-check
      - name: Verify dist (skip if no prior gen artifacts)
        run: |
          if [ -f dist/manifest.json ]; then
            pnpm fc verify
          else
            echo "No dist/manifest.json — skipping verify (gen runs on deploy hosts)."
          fi

  # The same gates `pnpm news:deploy` runs before publishing, so a story pull request
  # that is green here can be merged and published without a local rebuild.
  news:
    runs-on: ubuntu-latest
    # A cold image cache re-encodes every hero variant (about 5,000, AVIF the slow part): ~30 min.
    # With the cache below a run only encodes new images and takes a few minutes.
    timeout-minutes: 45
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Only a change that can alter how a page looks (scripts/ci-scope.mjs: the calendar build's
      # import graph, /news/ code, brand, dependencies) runs the calendar build and contrast gate.
      # Stories, printable generators, audits and docs skip them: about two minutes per push.
      - name: What changed?
        id: scope
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          git fetch -q --depth=1 origin "$base" 2>/dev/null || base=""
          node scripts/ci-scope.mjs "$base" | tee -a "$GITHUB_OUTPUT"
      # Astro's optimized-image cache. Entries are named by a hash of the source and the options,
      # so a stale entry is never used for a changed image; restore-keys picks up the latest cache.
      - name: Restore image cache
        uses: actions/cache/restore@v4
        with:
          path: apps/news/node_modules/.astro/assets
          key: news-images-${{ hashFiles('apps/news/src/assets/**', 'apps/news/src/components/Hero.astro') }}-${{ github.run_id }}
          restore-keys: |
            news-images-${{ hashFiles('apps/news/src/assets/**', 'apps/news/src/components/Hero.astro') }}-
            news-images-
      - name: Count cached images
        id: cache_before
        run: echo "n=$(find apps/news/node_modules/.astro/assets -type f 2>/dev/null | wc -l)" >>"$GITHUB_OUTPUT"
      - name: Build /news/ (frontmatter schema, hero size, references)
        run: pnpm news:build
        timeout-minutes: 40
      - name: New images encoded?
        id: cache_after
        if: always()
        run: |
          n="$(find apps/news/node_modules/.astro/assets -type f 2>/dev/null | wc -l)"
          echo "new=$(( n > ${{ steps.cache_before.outputs.n }} ))" >>"$GITHUB_OUTPUT"
      # Saved only when the build encoded something new (even if it then failed or timed out, so
      # the next run starts from it); otherwise the restored cache is already current.
      - name: Save image cache
        if: always() && steps.cache_after.outputs.new == '1'
        uses: actions/cache/save@v4
        with:
          path: apps/news/node_modules/.astro/assets
          key: news-images-${{ hashFiles('apps/news/src/assets/**', 'apps/news/src/components/Hero.astro') }}-${{ github.run_id }}
      - name: Verify (links, H1, orphans)
        run: pnpm news:verify
      - name: SEO and writing audit
        run: pnpm news:seo-audit
      # Text contrast gate (WCAG AA 4.5:1, 3:1 for large text) over every calendar and /news/ page,
      # desktop and phone, plus hover and focus on representative pages. Needs the calendar pages
      # too, but only their HTML and CSS (--html-only: seconds instead of 9.5 minutes of studio
      # sheets, OG images and previews; the server's daily bake still renders those).
      - name: Install Chromium
        if: steps.scope.outputs.visual == 'true'
        run: pnpm --filter @freshcalendars/generator exec playwright install --with-deps chromium
      - name: Build calendar site HTML
        if: steps.scope.outputs.visual == 'true'
        run: pnpm fc gen-meta --html-only
      - name: Text contrast (WCAG AA)
        if: steps.scope.outputs.visual == 'true'
        run: pnpm smoke:contrast
      - name: Changed stories
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git diff --name-status FETCH_HEAD -- apps/news/src/content apps/news/public/downloads >> "$GITHUB_STEP_SUMMARY" || true
