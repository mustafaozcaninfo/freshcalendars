name: Scheduled stories

# A story with a future publishedAt is left out of the build until that time. A run checks the
# deployed commit for stories that came due since its build, and if there are any, rebuilds that
# same commit and publishes it (newer commits publish through CI as usual).
# GitHub starts scheduled runs late and skips many (2 of about 36 in the first hours), so a run
# that finds nothing due but a story due within MAX_WAIT waits for it on the runner, then checks
# again. Any one run in the hours before a story is enough, and the story goes live about 5 min
# after its time. The repository is public, so the waiting minutes cost nothing.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-stories
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-24.04
    timeout-minutes: 340  # MAX_WAIT plus the checks; GitHub's limit is 360
    outputs:
      sha: ${{ steps.due.outputs.sha }}
      stories: ${{ steps.due.outputs.stories }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install rclone
        run: |
          curl -fsSLo /tmp/rclone.deb https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.deb
          echo "efbfe852181f7191eb3c9043ed1ab49c9b2d0ba045c61c926a5da111c939ec5c  /tmp/rclone.deb" | sha256sum -c -
          sudo dpkg -i /tmp/rclone.deb >/dev/null && rclone version | sed -n 1p  # sed reads to the end; head -1 exits early and rclone dies of SIGPIPE (141) under pipefail
      - name: Stories due since the last build
        id: due
        env:
          MAX_WAIT: 19800  # 5.5 h in seconds
        run: |
          check() {
            sha="$(cloudflare/deploy.sh state-get news/sha)"
            since="$(cloudflare/deploy.sh state-get news/built-at)"
            [[ -n "$sha" && -n "$since" ]] || { echo "nothing deployed yet"; exit 0; }
            # After the wait the deployed commit can be newer than this clone; fetch it first.
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch -q origin "$sha" || git fetch -q origin main
            git checkout -q "$sha"
            stories="$(node cloudflare/due-stories.mjs "$since")"
            echo "deployed ${sha:0:7}, built $(date -d "@$since" -Is); due: ${stories:-none}"
          }
          check
          if [[ -z "$stories" ]]; then
            next="$(node cloudflare/due-stories.mjs --next)"
            if [[ -n "$next" ]] && (( next - $(date +%s) <= MAX_WAIT )); then
              echo "next story due $(date -d "@$next" -Is); waiting for it"
              sleep $(( next - $(date +%s) + 20 ))
              # A push may have published a newer commit meanwhile; check what is deployed now.
              check
            fi
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "stories=$stories" >>"$GITHUB_OUTPUT"

  build:
    needs: due
    if: needs.due.outputs.stories != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      built-at: ${{ steps.build_start.outputs.t }}
    env:
      TZ: America/New_York
      NEWS_ASSETS_PREFIX: https://cdn.freshcalendars.com/news
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.due.outputs.sha }}
      - uses: ./.github/actions/setup
        with:
          rclone: "true"
      - name: Restore image cache
        id: image_cache
        uses: actions/cache/restore@v6
        with:
          path: apps/news/node_modules/.astro/assets
          key: news-images-${{ hashFiles('apps/news/src/assets/**', 'apps/news/src/components/Hero.astro') }}-${{ github.run_id }}
          restore-keys: |
            news-images-${{ hashFiles('apps/news/src/assets/**', 'apps/news/src/components/Hero.astro') }}-
            news-images-
      - if: steps.image_cache.outputs.cache-matched-key == ''
        run: cloudflare/deploy.sh pull-image-cache
      - name: Trending stories (Cloudflare analytics, optional)
        # Ranks the last 24 hours of story views for the "Trending now" box; without the token or
        # when Cloudflare fails it warns and the build leaves the box out (scripts/news-trending.mjs).
        continue-on-error: true
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: pnpm news:trending
      - name: Build start
        id: build_start
        run: echo "t=$(date +%s)" >>"$GITHUB_OUTPUT"
      - run: pnpm news:build
      - run: pnpm news:verify
      - run: pnpm news:seo-audit
      - name: Upload new images and pack the build
        run: |
          cloudflare/deploy.sh images
          tar -czf news-build.tar.gz --exclude 'news/_astro' -C dist news news-data
      - uses: actions/upload-artifact@v7
        with:
          name: news-build
          path: news-build.tar.gz
          retention-days: 3
          compression-level: 0

  deploy:
    needs: [due, build]
    uses: ./.github/workflows/deploy.yml
    with:
      artifact: news-build
      news-sha: ${{ needs.due.outputs.sha }}
      news-built-at: ${{ needs.build.outputs.built-at }}
    secrets: inherit
