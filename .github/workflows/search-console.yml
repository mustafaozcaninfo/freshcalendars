name: Search Console

# Daily read of Search Console and of Cloudflare traffic (docs/desk/traffic.md) for the desk (scripts/news-gsc.mjs): clicks, impressions, the pages
# and queries worth improving, an indexing sample and the numbers of the phase gate in
# docs/DESK.md. It commits docs/desk/search-console.{json,md} straight to main; the research and
# update desks read them there. Docs only, so nothing is built or deployed (a push with the
# Actions token starts no workflow). Secrets: GSC_SERVICE_ACCOUNT_JSON (read-only service account),
# GSC_SITE ("sc-domain:freshcalendars.com").
on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:

concurrency:
  group: search-console
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Read Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
        run: node scripts/news-gsc.mjs
      - name: Read Cloudflare traffic
        # Edge page views, sources (Google, Bing...), countries, devices and PDF downloads
        # (scripts/news-traffic.mjs); optional, a Cloudflare failure leaves the old report in place.
        continue-on-error: true
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_AE_TOKEN: ${{ secrets.CF_AE_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/news-traffic.mjs
      - name: Read Microsoft Clarity
        # Per page, channel and device for the last 24 hours (scripts/news-clarity.mjs, 3 of the
        # API's 10 daily requests); optional, a refused request leaves the old report in place.
        continue-on-error: true
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: node scripts/news-clarity.mjs
      - name: Commit the data
        run: |
          # The identity must be set for the whole step: the rebase below re-commits when main has moved.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in search-console.json search-console.md traffic.json traffic.md clarity.json clarity.md; do
            if [ -f "docs/desk/$f" ]; then git add "docs/desk/$f"; fi
          done
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "desk: Search Console data of $(date -u +%F)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
