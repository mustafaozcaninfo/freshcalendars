name: Set up the repository
description: pnpm, Node 22, dependencies and (optionally) rclone for R2.
inputs:
  rclone:
    description: Install rclone (R2 uploads and the deploy state)
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      # version comes from package.json packageManager field
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Install rclone
      if: inputs.rclone == 'true'
      shell: bash
      run: sudo apt-get install -y -qq rclone >/dev/null && rclone version | head -1
