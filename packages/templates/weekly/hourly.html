<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    /* Hourly week: 7 a.m. to 7 p.m. in one-hour rows. */
    body { margin: 0; width: 1100px; height: 1420px; padding: 42px 44px 0; background: #fff; color: #16202b; font-family: Manrope, sans-serif; }
    header { height: 112px; display: flex; align-items: flex-end; gap: 24px; padding-bottom: 20px; }
    h1 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 58px; line-height: 1; letter-spacing: -1px; white-space: nowrap; color: #12365e; }
    .of { font-family: Sora, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; padding-bottom: 4px; }
    .line { flex: 1; border-bottom: 4px solid #16202b; height: 70px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 4px solid #16202b; }
    th { font-family: Sora, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; color: #fff; background: #12365e; padding: 12px 2px; border: 2px solid #16202b; }
    th.time, td.time { width: 84px; }
    td { height: 87px; border: 2px solid #5f7182; }
    td.time { vertical-align: top; padding: 6px 8px; text-align: right; font-family: Sora, sans-serif; font-weight: 700; font-size: 22px; background: #eef3f9; border-color: #16202b; }
    footer { padding-top: 16px; font-size: 13px; letter-spacing: 1.5px; text-align: center; color: #42556c; }
  </style>
</head>
<body>
  <header>
    <h1>Hourly Planner</h1><div class="of">Week of</div><div class="line"></div>
  </header>
  {{hourlyTableHtml}}
  <footer>FRESHCALENDARS.COM · FREE FOR PERSONAL &amp; CLASSROOM USE</footer>
</body>
</html>
