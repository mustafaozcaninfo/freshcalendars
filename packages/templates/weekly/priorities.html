<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#1c2430; --accent:#007bff; --line:#c5d3dc; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 1100px; height: 1420px; padding: 36px 40px;
      background: #e8eef3; color: var(--ink); font-family: Manrope, "IBM Plex Sans", sans-serif; color: var(--ink); font-family: Manrope, "IBM Plex Sans", sans-serif;
    }
    .sheet {
      height: 100%; border: 2px solid var(--ink); background: #ffffff;
      padding: 24px; display: grid; grid-template-columns: 1.4fr .9fr; gap: 18px;
    }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .head { border-bottom: 3px solid var(--accent); padding-bottom: 12px; margin-bottom: 14px; }
    .brand { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    h1 { margin: 4px 0 0; font-family: Sora, "IBM Plex Sans", sans-serif; font-size: 42px; line-height: 1; }
    .days { flex: 1; display: grid; grid-template-rows: repeat(7, 1fr); gap: 6px; }
    .day {
      border: 1px solid var(--line); display: grid; grid-template-columns: 5.5rem 1fr; min-height: 0;
    }
    .day .dow {
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      padding: 10px; background: #f3ebe0; border-right: 1px solid var(--line);
      display: flex; align-items: center;
    }
    .day .box { padding: 8px; }
    .side { border: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .side h2 { margin: 0; font-family: Sora, "IBM Plex Sans", sans-serif; font-size: 22px; }
    .prio { border-bottom: 1px solid var(--line); padding: 10px 0; min-height: 3.2rem; font-size: 13px; color: #666; }
    .notes { flex: 1; border: 1px dashed var(--line); min-height: 12rem; }
    .foot { grid-column: 1 / -1; font-size: 11px; color: #666; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="main">
      <header class="head">
        <div class="brand">Fresh Calendars · Priorities</div>
        <h1>Focus week</h1>
      </header>
      <div class="days">{{daysHtmlStacked}}</div>
    </div>
    <aside class="side">
      <h2>Top 3</h2>
      <div class="prio">1.</div>
      <div class="prio">2.</div>
      <div class="prio">3.</div>
      <h2>Notes</h2>
      <div class="notes"></div>
    </aside>
    <div class="foot"><span>Weekly priorities planner</span><span>freshcalendars.com</span></div>
  </div>
</body>
</html>
