<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    /* Priorities week: a row per day, three priorities and notes at the side. */
    body { margin: 0; width: 1100px; height: 1420px; padding: 42px 44px 0; background: #fff; color: #16202b; font-family: Manrope, sans-serif; }
    header { height: 112px; display: flex; align-items: flex-end; gap: 24px; padding-bottom: 20px; }
    h1 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 58px; line-height: 1; letter-spacing: -1px; white-space: nowrap; color: #0a6a9a; }
    .of { font-family: Sora, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; padding-bottom: 4px; }
    .line { flex: 1; border-bottom: 4px solid #16202b; height: 70px; }
    .sheet { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
    .days { border: 4px solid #16202b; }
    .day { display: grid; grid-template-columns: 96px 1fr; height: 171px; border-bottom: 2px solid #16202b; }
    .day:last-child { border-bottom: 0; height: 172px; }
    .dow { padding: 16px 0; text-align: center; font-family: Sora, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 1px; text-transform: uppercase; color: #fff; background: #0a7fb8; border-right: 2px solid #16202b; }
    .box { margin: 0 16px; background: repeating-linear-gradient(transparent 0 41px, #8a9aa8 41px 42.5px); }
    aside { border: 4px solid #16202b; padding: 16px; height: 1206px; display: flex; flex-direction: column; }
    aside h2 { margin: 0 0 6px; font-family: Sora, sans-serif; font-weight: 700; font-size: 30px; line-height: 1.2; }
    .prio { height: 92px; padding-top: 46px; font-family: Sora, sans-serif; font-weight: 700; font-size: 28px; border-bottom: 2.5px solid #5f7182; }
    .prio + h2 { margin-top: 36px; }
    .notes { flex: 1; background: repeating-linear-gradient(transparent 0 41px, #8a9aa8 41px 42.5px); }
    footer { padding-top: 16px; font-size: 13px; letter-spacing: 1.5px; text-align: center; color: #42556c; }
  </style>
</head>
<body>
  <header>
    <h1>Weekly Focus</h1><div class="of">Week of</div><div class="line"></div>
  </header>
  <div class="sheet">
    <div class="days">{{daysHtmlStacked}}</div>
    <aside>
      <h2>Top 3</h2>
      <div class="prio">1.</div>
      <div class="prio">2.</div>
      <div class="prio">3.</div>
      <h2>Notes</h2>
      <div class="notes"></div>
    </aside>
  </div>
  <footer>FRESHCALENDARS.COM · FREE FOR PERSONAL &amp; CLASSROOM USE</footer>
</body>
</html>
