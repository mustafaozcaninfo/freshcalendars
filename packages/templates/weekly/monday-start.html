<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    /* Weekly planner, Monday first: one ruled row per day. */
    body { margin: 0; width: 1100px; height: 1420px; padding: 42px 44px 0; background: #fff; color: #16202b; font-family: Manrope, sans-serif; }
    header { height: 112px; display: flex; align-items: flex-end; gap: 24px; padding-bottom: 20px; }
    h1 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 58px; line-height: 1; letter-spacing: -1px; white-space: nowrap; color: #0c4a45; }
    .of { font-family: Sora, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; padding-bottom: 4px; }
    .line { flex: 1; border-bottom: 4px solid #16202b; height: 70px; }
    .days { border: 4px solid #16202b; }
    .day { display: grid; grid-template-columns: 190px 1fr; height: 171px; border-bottom: 2px solid #16202b; }
    .day:last-child { border-bottom: 0; height: 172px; }
    .dow { display: flex; align-items: flex-start; padding: 16px 14px; font-family: Sora, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; color: #fff; background: #0f766e; border-right: 2px solid #16202b; }
    .box { padding: 0 16px; }
    .lines { height: 100%; background: repeating-linear-gradient(transparent 0 41px, #8a9aa8 41px 42.5px); }
    footer { padding-top: 16px; font-size: 15px; letter-spacing: .5px; text-align: center; color: #42556c; }
  </style>
</head>
<body>
  <header>
    <h1>Weekly Planner</h1><div class="of">Week of</div><div class="line"></div>
  </header>
  <div class="days">{{daysHtml}}</div>
  <footer>freshcalendars.com</footer>
</body>
</html>
