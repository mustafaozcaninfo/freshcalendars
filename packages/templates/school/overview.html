<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#0b3d66; --accent:#007bff; --gold:#fccc00; --paper:#e8eef3; --line:#c5d3dc; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 1100px; height: 1420px; padding: 34px 38px;
      background: linear-gradient(165deg, #e8eef3 0%, #c5d8e4 55%, #b0cfe6 100%);
      color: var(--ink); font-family: Manrope, "IBM Plex Sans", sans-serif;
    }
    .poster {
      height: 100%; border: 2px solid var(--ink); background: rgba(255,255,255,.78);
      padding: 24px 24px 18px; display: flex; flex-direction: column;
    }
    .hero {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 3px solid var(--accent); padding-bottom: 12px; margin-bottom: 14px;
    }
    .brand { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    h1 { margin: 4px 0 0; font-family: Sora, "IBM Plex Sans", sans-serif; font-size: 42px; line-height: .95; }
    .year-mark {
      font-family: Sora, "IBM Plex Sans", sans-serif; font-size: 36px; line-height: 1; color: var(--accent); text-align: right;
    }
    .year-mark small { display: block; font-size: 13px; font-family: Manrope, "IBM Plex Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #567; margin-top: 4px; }
    .grid {
      flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr);
      gap: 12px;
    }
    .month { border: 1px solid var(--line); padding: 8px 8px 6px; background: #fff; }
    .month h2 {
      margin: 0 0 6px; font-family: Sora, "IBM Plex Sans", sans-serif; font-size: 14px; font-weight: 600; color: var(--accent);
    }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { font-size: 8px; color: #678; font-weight: 600; padding: 1px 0; }
    td {
      font-size: 10px; text-align: center; padding: 2px 0; height: 16px;
      font-variant-numeric: tabular-nums;
    }
    .foot { margin-top: 10px; display: flex; justify-content: space-between; font-size: 11px; color: #567; }
  </style>
</head>
<body>
  <div class="poster">
    <header class="hero">
      <div>
        <div class="brand">Fresh Calendars · School year</div>
        <h1>Academic year</h1>
      </div>
      <div class="year-mark">{{spanLabel}}<small>Aug → Jul</small></div>
    </header>
    <div class="grid">{{monthsHtml}}</div>
    <div class="foot">
      <span>Mark district breaks by hand · not an official calendar</span>
      <span>freshcalendars.com</span>
    </div>
  </div>
</body>
</html>
