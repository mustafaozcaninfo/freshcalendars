<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0; width: 1200px; height: 630px;
      display: flex; align-items: stretch;
      font-family: "Sora", system-ui, sans-serif;
      background: #f4f8fb;
      color: #0e2135;
    }
    .panel {
      flex: 1; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .brand { letter-spacing: -.06em; font-weight:700; font-size: 30px; font-family: system-ui, sans-serif; color:#007b48; }
    h1 { margin: 18px 0 0; font-size: 58px; line-height: 1.14; max-width: 23ch; letter-spacing:-.04em; }
    .sub { font-size: 22px; color:#526981; margin-top: 14px; font-family: system-ui, sans-serif; }
    .mark {
      width: 280px; display: flex; align-items: center; justify-content: center;
      font-size: 112px; font-weight: 700; color:#007b48; background:#e8f3ed; border-left:1px solid #d7e7df;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div>
      <div class="brand">Fresh Calendars</div>
      <h1>{{title}}</h1>
      <div class="sub">{{subtitle}}</div>
    </div>
    <div class="sub">freshcalendars.com</div>
  </div>
  <div class="mark">{{mark}}</div>
</body>
</html>
