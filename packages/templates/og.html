<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0; width: 1200px; height: 630px;
      display: flex; align-items: stretch;
      font-family: Georgia, "Times New Roman", serif;
      background: {{bg}};
      color: {{ink}};
    }
    .panel {
      flex: 1; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .brand { letter-spacing: .2em; text-transform: uppercase; font-size: 18px; font-family: system-ui, sans-serif; opacity: .85; }
    h1 { margin: 18px 0 0; font-size: 64px; line-height: 1.05; max-width: 14ch; }
    .sub { font-size: 24px; opacity: .8; margin-top: 14px; font-family: system-ui, sans-serif; }
    .mark {
      width: 280px; display: flex; align-items: center; justify-content: center;
      font-size: 140px; font-weight: 700; opacity: .18; border-left: 1px solid rgba(0,0,0,.12);
    }
  </style>
</head>
<body>
  <div class="panel">
    <div>
      <div class="brand">Fresh Calendars</div>
      <h1>{{title}}</h1>
      <div class="sub">{{subtitle}}</div>
    </div>
    <div class="sub">freshcalendars.com</div>
  </div>
  <div class="mark">{{mark}}</div>
</body>
</html>
