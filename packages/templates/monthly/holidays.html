<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --weeks: {{weeks}}; }
    * { box-sizing: border-box; }
    /* Holidays: navy and red, weekends tinted, every holiday named in its box and listed below. */
    body { margin: 0; width: 1100px; height: 1420px; padding: 40px 44px 0; background: #fff; color: #14263d; font-family: Manrope, sans-serif; }
    .top { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 16px; border-bottom: 6px solid #c22d16; margin-bottom: 18px; }
    h1 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 78px; line-height: 1; letter-spacing: -1.5px; color: #12365e; }
    .tag { font-family: Sora, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 2.5px; text-transform: uppercase; color: #fff; background: #c22d16; padding: 10px 16px; border-radius: 8px; margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 3px solid #12365e; }
    th { font-family: Sora, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; background: #12365e; padding: 11px 4px; border: 2px solid #12365e; }
    td { height: calc(1010px / var(--weeks)); vertical-align: top; padding: 8px 12px; border: 2px solid #7f95b0; }
    td.we { background: #f1f5fa; }
    td .n { font-family: Sora, sans-serif; font-weight: 700; font-size: 38px; line-height: 1.1; }
    td.hol { background: #fdecea; }
    td.hol .n, td .hol-label { color: #c22d16; }
    td .hol-label { margin-top: 4px; font-size: 15px; font-weight: 700; line-height: 1.2; }
    .hol-list { height: 104px; margin-top: 14px; overflow: hidden; columns: 2; column-gap: 28px; font-size: 16px; line-height: 1.55; color: #14263d; }
    .hol-list strong { color: #c22d16; }
    footer { padding-top: 6px; font-size: 15px; letter-spacing: .5px; text-align: center; color: #42556c; }
  </style>
</head>
<body>
  <header class="top">
    <h1>{{monthName}} {{year}}</h1>
    <div class="tag">US Holidays</div>
  </header>
  <table>
    <thead><tr>{{weekdayHeader}}</tr></thead>
    <tbody>{{weeksHtml}}</tbody>
  </table>
  <div class="hol-list">{{holidayListHtml}}</div>
  <footer>freshcalendars.com</footer>
</body>
</html>
