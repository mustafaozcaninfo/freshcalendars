<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#1b2430; --red:#ec1d00; --blue:#007bff; --line:#d0d7e0; --week:#eef5fb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 1100px; height: 1420px; padding: 40px 44px;
      background: #fff; color: var(--ink);
      font-family: "Source Sans 3", sans-serif;
    }
    .sheet { height: 100%; display: flex; flex-direction: column; }
    .top {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
      gap: 16px; border-bottom: 3px double var(--blue); padding-bottom: 12px; margin-bottom: 14px;
    }
    .brand { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--blue); font-weight: 700; }
    h1 {
      margin: 4px 0 0; font-family: "Libre Baskerville", serif;
      font-size: 52px; line-height: 1; color: var(--blue);
    }
    .flag {
      width: 64px; height: 42px; border: 1px solid var(--line);
      background:
        linear-gradient(#fff 33%, var(--red) 33%, var(--red) 66%, #fff 66%),
        repeating-linear-gradient(90deg, var(--blue) 0 8px, #fff 8px 16px);
      background-size: 100% 100%, 40% 40%;
      background-repeat: no-repeat;
      background-position: 0 0, 0 0;
      justify-self: center;
    }
    .meta { text-align: right; }
    .meta strong { display: block; font-size: 36px; font-weight: 800; color: var(--red); line-height: 1; }
    .meta span { font-size: 13px; color: #556; }
    .legend { font-size: 12px; color: #556; margin-bottom: 8px; }
    .legend b { color: var(--red); }
    table.cal { width: 100%; flex: 1; border-collapse: collapse; table-layout: fixed; }
    th {
      font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      padding: 8px 4px; border-bottom: 2px solid var(--blue); background: var(--week);
    }
    th.we { color: var(--red); }
    td {
      border: 1px solid var(--line); vertical-align: top; height: 155px; padding: 8px 9px;
      background: #fff;
    }
    td.we { background: #fff8f8; }
    td .n { font-size: 20px; font-weight: 800; }
    td.we .n { color: var(--red); }
    td.hol { background: #fff0f0; }
    td.hol .n { color: var(--red); }
    td .hol-label {
      margin-top: 6px; font-size: 11px; font-weight: 600; color: var(--red);
      line-height: 1.25; max-height: 3.6em; overflow: hidden;
    }
    .hol-list {
      margin-top: 10px; font-size: 12px; border-top: 1px solid var(--line); padding-top: 8px;
      color: #445; columns: 2; gap: 16px;
    }
    .hol-list strong { color: var(--red); }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="top">
      <div>
        <div class="brand">Fresh Calendars · US Holidays</div>
        <h1>{{monthName}}</h1>
      </div>
      <div class="flag" aria-hidden="true"></div>
      <div class="meta">
        <strong>{{year}}</strong>
        <span>{{subtitle}}</span>
      </div>
    </header>
    <div class="legend">Weekends in <b>red</b> · Federal holidays labeled in-cell</div>
    <table class="cal">
      <thead><tr>{{weekdayHeader}}</tr></thead>
      <tbody>{{weeksHtml}}</tbody>
    </table>
    <div class="hol-list">{{holidayListHtml}}</div>
  </div>
</body>
</html>
