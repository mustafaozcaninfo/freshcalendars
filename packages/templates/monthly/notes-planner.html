<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --weeks: {{weeks}}; }
    * { box-sizing: border-box; }
    /* Planner: ruled date boxes and a notes column for handwriting. */
    body { margin: 0; width: 1100px; height: 1420px; padding: 40px 40px 0; background: #fff; color: #16202b; font-family: Manrope, sans-serif; }
    .sheet { display: grid; grid-template-columns: 1fr 232px; gap: 20px; }
    h1 { margin: 0 0 20px; padding-bottom: 14px; border-bottom: 5px solid #0a7fb8; font-family: Sora, sans-serif; font-weight: 700; font-size: 70px; line-height: 1; letter-spacing: -1.5px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 3px solid #16202b; }
    th { font-family: Sora, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; background: #0a7fb8; padding: 10px 2px; border: 2px solid #16202b; }
    td { height: calc(1165px / var(--weeks)); vertical-align: top; padding: 5px 8px; border: 2px solid #5f7182; background: repeating-linear-gradient(transparent 0 27px, #cfd9e2 27px 28.5px) 0 52px no-repeat #fff; }
    td .n { font-family: Sora, sans-serif; font-weight: 700; font-size: 32px; line-height: 1.1; }
    td.hol .n, td .hol-label { color: #0a6a9a; }
    td .hol-label { display: inline; background: #fff; font-size: 13px; font-weight: 700; line-height: 1.25; }
    aside { border: 3px solid #16202b; padding: 16px 16px 0; display: flex; flex-direction: column; height: 1340px; }
    aside h2 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 30px; line-height: 1.2; }
    aside h2 + div { flex: 1; margin-bottom: 18px; background: repeating-linear-gradient(transparent 0 38px, #8a9aa8 38px 39.5px); }
    aside h2.small { font-size: 20px; letter-spacing: 1.5px; text-transform: uppercase; color: #0a6a9a; }
    aside h2.small + div { flex: 0 0 158px; }
    footer { padding-top: 14px; font-size: 13px; letter-spacing: 1.5px; color: #42556c; }
  </style>
</head>
<body>
  <div class="sheet">
    <main>
      <h1>{{monthName}} {{year}}</h1>
      <table>
        <thead><tr>{{weekdayHeader}}</tr></thead>
        <tbody>{{weeksHtml}}</tbody>
      </table>
      <footer>FRESHCALENDARS.COM · FREE FOR PERSONAL &amp; CLASSROOM USE</footer>
    </main>
    <aside>
      <h2>Notes</h2><div></div>
      <h2 class="small">Priorities</h2><div></div>
      <h2 class="small">Next month</h2><div></div>
    </aside>
  </div>
</body>
</html>
