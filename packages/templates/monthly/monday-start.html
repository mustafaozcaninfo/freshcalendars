<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --weeks: {{weeks}}; }
    * { box-sizing: border-box; }
    /* Minimal: black ink only. Heavy title, big dates, holiday names in the boxes. */
    body { margin: 0; width: 1100px; height: 1420px; padding: 42px 44px 0; background: #fff; color: #000; font-family: Manrope, sans-serif; }
    h1 { margin: 0 0 26px; font-family: Sora, sans-serif; font-weight: 700; font-size: 84px; line-height: 1; letter-spacing: 2px; text-transform: uppercase; text-align: center; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 4px solid #000; }
    th { font-family: Sora, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 4px; border: 2px solid #000; }
    td { height: calc(1150px / var(--weeks)); vertical-align: top; padding: 8px 12px; border: 2px solid #000; }
    td .n { font-family: Sora, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.1; }
    td .hol-label { margin-top: 4px; font-size: 15px; font-weight: 700; line-height: 1.2; }
    footer { padding-top: 16px; font-size: 13px; letter-spacing: 1.5px; text-align: center; color: #333; }
  </style>
</head>
<body>
  <h1>{{monthName}} {{year}}</h1>
  <table>
    <thead><tr>{{weekdayHeader}}</tr></thead>
    <tbody>{{weeksHtml}}</tbody>
  </table>
  <footer>FRESHCALENDARS.COM · FREE FOR PERSONAL &amp; CLASSROOM USE</footer>
</body>
</html>
