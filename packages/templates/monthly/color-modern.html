<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#1c2430; --accent:#007bff; --warm:#ec1d00; --gold:#fccc00; --soft:#eef5fb; --line:#c5d8db; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 1100px; height: 1420px; padding: 36px;
      background: #f2f7f8; color: var(--ink);
      font-family: Manrope, "IBM Plex Sans", sans-serif;
    }
    .sheet {
      height: 100%; display: flex; flex-direction: column;
      background: #fff; border-radius: 8px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(18,38,58,.08);
    }
    .banner {
      background: linear-gradient(105deg, #004a7f 0%, var(--accent) 55%, #0092d1 100%);
      color: #fff; padding: 28px 32px 24px;
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 5px solid var(--gold);
    }
    .brand { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; opacity: .9; font-weight: 600; }
    h1 { margin: 6px 0 0; font-size: 68px; line-height: .88; font-weight: 800; letter-spacing: -.03em; font-family: Sora, Manrope, sans-serif; }
    .year-badge {
      width: 88px; height: 88px; border-radius: 50%; background: var(--gold); color: #1c2430;
      display: grid; place-items: center; font-weight: 800; font-size: 28px; line-height: 1;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .year-badge small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; opacity: .7; }
    .pad { flex: 1; padding: 18px 28px 22px; display: flex; flex-direction: column; }
    .tag { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
    table.cal { width: 100%; flex: 1; border-collapse: separate; border-spacing: 6px; table-layout: fixed; }
    th {
      font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: #fff; background: var(--ink); padding: 10px 4px; border-radius: 4px;
    }
    td {
      border: 1px solid var(--line); vertical-align: top; height: 148px; padding: 10px;
      background: var(--soft); border-radius: 6px;
    }
    td .n { font-size: 24px; font-weight: 700; color: var(--ink); }
    td.hol { background: #fff4f1; border-color: #f0b4ab; }
    td.hol .n { color: var(--warm); }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="banner">
      <div>
        <div class="brand">Fresh Calendars · Monthly</div>
        <h1>{{monthName}}</h1>
      </div>
      <div class="year-badge">
        <div>{{year}}<small>YEAR</small></div>
      </div>
    </header>
    <div class="pad">
      <div class="tag">{{subtitle}}</div>
      <table class="cal">
        <thead><tr>{{weekdayHeader}}</tr></thead>
        <tbody>{{weeksHtml}}</tbody>
      </table>
    </div>
  </div>
</body>
</html>
