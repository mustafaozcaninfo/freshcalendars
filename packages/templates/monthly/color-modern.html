<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --weeks: {{weeks}}; }
    * { box-sizing: border-box; }
    /* Modern: a blue title band, rounded date boxes, holidays in coral. */
    body { margin: 0; width: 1100px; height: 1420px; padding: 36px 36px 0; background: #fff; color: #16202b; font-family: Manrope, sans-serif; }
    .banner { height: 150px; padding: 0 36px; border-radius: 16px; background: linear-gradient(105deg, #063f7a 0%, #0b6fd6 60%, #1193dc 100%); border-bottom: 8px solid #fccc00; color: #fff; display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 78px; line-height: 1; letter-spacing: -1.5px; }
    .tag { font-family: Sora, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; text-align: right; line-height: 1.5; }
    table { width: calc(100% + 12px); margin: 10px -6px 0; border-collapse: separate; border-spacing: 6px; table-layout: fixed; }
    th { font-family: Sora, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; background: #16202b; padding: 11px 4px; border-radius: 8px; }
    td { height: calc(1040px / var(--weeks)); vertical-align: top; padding: 8px 12px; background: #eef5fc; border: 2px solid #b5cde6; border-radius: 12px; }
    td.empty { background: #f7f9fb; border-color: #e1e8ef; }
    td .n { font-family: Sora, sans-serif; font-weight: 700; font-size: 38px; line-height: 1.1; }
    td.hol { background: #fff0ec; border-color: #ef8b78; }
    td.hol .n, td .hol-label { color: #c22d16; }
    td .hol-label { margin-top: 4px; font-size: 15px; font-weight: 700; line-height: 1.2; }
    footer { padding-top: 10px; font-size: 13px; letter-spacing: 1.5px; text-align: center; color: #42556c; }
  </style>
</head>
<body>
  <header class="banner">
    <h1>{{monthName}} {{year}}</h1>
    <div class="tag">Fresh<br>Calendars</div>
  </header>
  <table>
    <thead><tr>{{weekdayHeader}}</tr></thead>
    <tbody>{{weeksHtml}}</tbody>
  </table>
  <footer>FRESHCALENDARS.COM · FREE FOR PERSONAL &amp; CLASSROOM USE</footer>
</body>
</html>
