<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --weeks: {{weeks}}; }
    * { box-sizing: border-box; }
    /* Landscape: US Letter on its side, a green title band, full weekday names. */
    body { margin: 0; width: 1600px; height: 1236px; padding: 40px 48px 0; background: #fff; color: #17332b; font-family: Manrope, sans-serif; }
    .banner { height: 148px; border-radius: 16px 16px 0 0; background: #24594b; color: #fff; display: flex; align-items: center; justify-content: center; }
    h1 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 92px; line-height: 1; letter-spacing: -1px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 3px solid #24594b; }
    th { font-family: Sora, sans-serif; font-weight: 700; font-size: 21px; letter-spacing: 1.5px; text-transform: uppercase; color: #17332b; background: #dcebe4; padding: 13px 4px; border: 2px solid #24594b; }
    td { height: calc(940px / var(--weeks)); vertical-align: top; padding: 8px 14px; border: 2px solid #6f988a; }
    td.we { background: #f3f8f5; }
    td .n { font-family: Sora, sans-serif; font-weight: 700; font-size: 46px; line-height: 1.1; }
    td.hol .n, td .hol-label { color: #b3261e; }
    td .hol-label { margin-top: 4px; font-size: 19px; font-weight: 700; line-height: 1.2; }
    footer { padding-top: 14px; font-size: 15px; letter-spacing: 1.5px; text-align: center; color: #42556c; }
  </style>
</head>
<body>
  <header class="banner"><h1>{{monthName}} {{year}}</h1></header>
  <table>
    <thead><tr>{{weekdayHeaderLong}}</tr></thead>
    <tbody>{{weeksHtml}}</tbody>
  </table>
  <footer>FRESHCALENDARS.COM · FREE FOR PERSONAL &amp; CLASSROOM USE</footer>
</body>
</html>
