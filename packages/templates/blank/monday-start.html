<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    /* Blank month, Monday to Sunday. */
    body { margin: 0; width: 1100px; height: 1420px; padding: 42px 44px 0; background: #fff; color: #16202b; font-family: Manrope, sans-serif; }
    header { height: 112px; display: flex; align-items: flex-end; gap: 28px; padding-bottom: 20px; }
    h1 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 54px; line-height: 1; letter-spacing: -1px; white-space: nowrap; color: #0f766e; }
    .line { flex: 1; border-bottom: 4px solid #16202b; height: 70px; }
    .line.year { flex: 0 0 200px; }
    .body { display: grid; grid-template-columns: 1fr; gap: 20px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 4px solid #16202b; border-radius:0;}
    th { font-family: Sora, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 4px; border: 2px solid #16202b; background:#eef1f4; }
    td { height: 226px; vertical-align: top; padding: 0; border: 2px solid #16202b;  }
    td .box { width: 52px; height: 46px; border-right: 2px solid #16202b; border-bottom: 2px solid #16202b; background:#fff; }
    aside { border: 4px solid #16202b; padding: 14px 16px; }
    aside h2 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 30px; line-height: 1.2; }
    aside div { height: 1120px; background: repeating-linear-gradient(transparent 0 38px, #8a9aa8 38px 39.5px); }
    footer { padding-top: 16px; font-size: 15px; letter-spacing: .5px; text-align: center; color: #42556c; }
  </style>
</head>
<body>
  <header>
    <h1>Month</h1><div class="line"></div><h1>Year</h1><div class="line year"></div>
  </header>
  <div class="body">
    <table>
      <thead><tr>{{weekdayHeader}}</tr></thead>
      <tbody>{{weeksHtml}}</tbody>
    </table>
  </div>
  <footer>freshcalendars.com</footer>
</body>
</html>
