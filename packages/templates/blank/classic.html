<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#2a3439; --accent:#5a6b75; --paper:#f2f4f6; --line:#d0d7de; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 1100px; height: 1420px; padding: 42px;
      background: repeating-linear-gradient(-12deg, transparent, transparent 18px, rgba(90,107,117,.05) 18px, rgba(90,107,117,.05) 19px), var(--paper);
      color: var(--ink); font-family: Manrope, "IBM Plex Sans", sans-serif;
    }
    .pad {
      height: 100%; border: 2px solid var(--ink); padding: 30px;
      background: rgba(255,255,255,.65); display: flex; flex-direction: column;
    }
    .brand { letter-spacing: .2em; text-transform: uppercase; font-size: 12px; color: var(--accent); font-weight: 700; }
    h1 { margin: 10px 0 6px; font-family: Sora, "IBM Plex Sans", sans-serif; font-size: 54px; font-weight: 500; }
    p.lead { margin: 0 0 20px; color: #4a5a50; max-width: 40ch; }
    .month-line {
      display: flex; gap: 12px; align-items: center; margin-bottom: 16px; font-size: 14px;
    }
    .month-line span {
      flex: 1; border-bottom: 1.5px solid var(--ink); height: 28px;
    }
    table { width: 100%; flex: 1; border-collapse: collapse; table-layout: fixed; }
    th {
      font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--accent); padding: 8px; border-bottom: 2px solid var(--accent);
    }
    td {
      border: 1px solid var(--line); height: 150px; vertical-align: top; padding: 10px;
      background: rgba(255,255,255,.8);
    }
    td .box {
      width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 2px; opacity: .35;
    }
    .foot { margin-top: 14px; font-size: 12px; color: #5a6b60; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="pad">
    <div class="brand">Fresh Calendars · Blank</div>
    <h1>Blank monthly</h1>
    <p class="lead">Undated template with room to write. Fill the month line, then plan each day.</p>
    <div class="month-line">Month / Year <span></span></div>
    <table>
      <thead><tr>{{weekdayHeader}}</tr></thead>
      <tbody>{{weeksHtml}}</tbody>
    </table>
    <div class="foot">
      <span>Reusable undated layout</span>
      <span>freshcalendars.com</span>
    </div>
  </div>
</body>
</html>
