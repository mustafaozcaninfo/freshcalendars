<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#2a3439; --line:#c8c8c8; --rule:#d8d8d8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 1100px; height: 1420px; padding: 36px 40px;
      background: #fff; color: var(--ink); font-family: "IBM Plex Sans", sans-serif;
    }
    .sheet { height: 100%; display: flex; flex-direction: column; border: 3px solid var(--ink); padding: 22px 24px 18px; }
    .brand { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; }
    h1 { margin: 6px 0 4px; font-family: "IBM Plex Serif", serif; font-size: 42px; font-weight: 600; }
    .month-line { display: flex; gap: 10px; align-items: center; margin: 8px 0 14px; font-size: 13px; }
    .month-line span { flex: 1; border-bottom: 1.5px solid var(--ink); height: 24px; }
    .body { flex: 1; display: grid; grid-template-columns: 1fr 220px; gap: 14px; min-height: 0; }
    table.cal { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
    th {
      font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      padding: 6px; border-bottom: 2px solid var(--ink); text-align: center;
    }
    td {
      border: 1px solid var(--line); vertical-align: top; padding: 8px;
      background:
        repeating-linear-gradient(transparent, transparent 17px, var(--rule) 17px, var(--rule) 18px);
    }
    td .box {
      width: 18px; height: 18px; border: 1.5px solid var(--ink); opacity: .4; background: #fff;
    }
    .notes {
      border: 1px solid var(--ink); padding: 12px; display: flex; flex-direction: column;
      background:
        repeating-linear-gradient(transparent, transparent 22px, var(--rule) 22px, var(--rule) 23px);
    }
    .notes h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; background: #fff; }
    .notes .fill { flex: 1; }
    .foot { margin-top: 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; display: flex; justify-content: space-between; color: #555; }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="brand">Fresh Calendars · Blank notes</div>
    <h1>Blank planner</h1>
    <div class="month-line">Month / Year <span></span></div>
    <div class="body">
      <table class="cal">
        <thead><tr>{{weekdayHeader}}</tr></thead>
        <tbody>{{weeksHtml}}</tbody>
      </table>
      <aside class="notes">
        <h2>Notes</h2>
        <div class="fill"></div>
      </aside>
    </div>
    <div class="foot">
      <span>Ruled undated · write-in</span>
      <span>freshcalendars.com</span>
    </div>
  </div>
</body>
</html>
