<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#1c2430; --accent:#007bff; --gold:#fccc00; --red:#ec1d00; --paper:#ffffff; --line:#d0d7de; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 1100px; height: 1420px; padding: 40px;
      background: radial-gradient(circle at 20% 10%, #ffe8d4, transparent 40%), var(--paper);
      color: var(--ink); font-family: Nunito, sans-serif;
    }
    .pad {
      height: 100%; border: 4px solid var(--ink); border-radius: 18px; padding: 28px;
      background: rgba(255,255,255,.82); display: flex; flex-direction: column;
    }
    .brand { letter-spacing: .16em; text-transform: uppercase; font-size: 13px; color: var(--accent); font-weight: 800; }
    h1 { margin: 8px 0 6px; font-family: Sora, "IBM Plex Sans", sans-serif; font-size: 48px; font-weight: 600; }
    p.lead { margin: 0 0 16px; color: #4a5560; max-width: 38ch; font-size: 18px; }
    .month-line {
      display: flex; gap: 12px; align-items: center; margin-bottom: 14px; font-size: 16px; font-weight: 700;
    }
    .month-line span {
      flex: 1; border-bottom: 2px dashed var(--ink); height: 32px;
    }
    table { width: 100%; flex: 1; border-collapse: collapse; table-layout: fixed; }
    th {
      font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      color: var(--accent); padding: 10px; border-bottom: 3px solid var(--accent);
    }
    td {
      border: 2px solid var(--line); height: 155px; vertical-align: top; padding: 14px;
      background: #fff;
    }
    td .box {
      width: 36px; height: 36px; border: 2.5px solid var(--ink); border-radius: 8px; opacity: .45;
    }
    .foot { margin-top: 12px; font-size: 13px; color: #5a6b76; display: flex; justify-content: space-between; font-weight: 700; }
  </style>
</head>
<body>
  <div class="pad">
    <div class="brand">Fresh Calendars · Kids blank</div>
    <h1>My month</h1>
    <p class="lead">Big boxes for writing, stickers, and classroom plans. Fill in the month yourself.</p>
    <div class="month-line">Month / Year <span></span></div>
    <table>
      <thead><tr>{{weekdayHeader}}</tr></thead>
      <tbody>{{weeksHtml}}</tbody>
    </table>
    <div class="foot">
      <span>Large write-in cells</span>
      <span>freshcalendars.com</span>
    </div>
  </div>
</body>
</html>
