<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    /* Landscape year poster: US Letter on its side. Twelve months of six rows each, so every box is full and the dates read from across a room. */
    body { margin: 0; width: 1600px; height: 1236px; padding: 36px 48px 0; background: #fff; color: #17332b; font-family: Manrope, sans-serif; }
    header { height: 104px; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 14px; border-bottom: 6px solid #24594b; margin-bottom: 20px; }
    h1 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 86px; line-height: .95; letter-spacing: -2px; color: #17332b; }
    .tag { font-family: Sora, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 2.5px; text-transform: uppercase; color:#24594b; margin-bottom: 6px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 28px; }
    .month {  }
    .month h2 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 26px; line-height: 40px; text-align: center; letter-spacing: .5px; color:#fff;background:#24594b;border-radius:8px; }
    .month table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .month th { height: 32px; font-family: Sora, sans-serif; font-weight: 700; font-size: 17px; color:#24594b; }
    .month td { height: 39px; padding: 0; text-align: center; font-size: 22px; font-weight: 700; line-height: 1; }
    .month td span { display: inline-block; min-width: 35px; line-height: 35px; border-radius: 50%; }
    .month td.we { background: #f0f7f3; }
    .month td.hol span { color: #c22d16; box-shadow: inset 0 0 0 2.5px #c22d16; }
    footer { padding-top: 16px; font-size: 15px; letter-spacing: .5px; text-align: center; color: #42556c; }
  </style>
</head>
<body>
  <header>
    <h1>{{year}} Calendar</h1>
    <div class="tag">Year at a glance</div>
  </header>
  <div class="grid">{{monthsHtml}}</div>
  <footer>freshcalendars.com</footer>
</body>
</html>
