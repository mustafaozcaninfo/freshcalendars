<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#0b3d66; --accent:#004a7f; --line:#c5d3dc; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 1100px; height: 1420px; padding: 36px 40px;
      background: #e8eef2; color: var(--ink); font-family: "Source Sans 3", sans-serif;
    }
    .poster {
      height: 100%; border: 2px solid var(--ink); background: #fff;
      padding: 26px; display: flex; flex-direction: column;
    }
    .hero {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 16px;
    }
    .brand { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
    h1 { margin: 4px 0 0; font-family: Sora, "IBM Plex Sans", sans-serif; font-size: 52px; line-height: .95; }
    .year-mark { font-family: Sora, "IBM Plex Sans", sans-serif; font-size: 96px; line-height: .8; color: var(--accent); }
    .tag { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--ink); padding: 3px 8px; }
    .grid {
      flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 12px;
    }
    .month { border: 1px solid var(--line); padding: 7px; background: #f7fafc; }
    .month h2 { margin: 0 0 5px; font-family: Sora, "IBM Plex Sans", sans-serif; font-size: 15px; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { font-size: 8px; color: #567; font-weight: 700; padding: 1px 0; }
    td { font-size: 10px; text-align: center; padding: 2px 0; height: 16px; font-variant-numeric: tabular-nums; }
    td.hol { color: var(--accent); font-weight: 700; }
    .foot { margin-top: 12px; display: flex; justify-content: space-between; font-size: 11px; color: #456; }
  </style>
</head>
<body>
  <div class="poster">
    <header class="hero">
      <div>
        <div class="brand">Fresh Calendars</div>
        <h1>Monday-start year</h1>
        <span class="tag">Mon → Sun weeks</span>
      </div>
      <div class="year-mark">{{year}}</div>
    </header>
    <div class="grid">{{monthsHtml}}</div>
    <div class="foot">
      <span>Printable {{year}} Monday-start calendar</span>
      <span>freshcalendars.com</span>
    </div>
  </div>
</body>
</html>
