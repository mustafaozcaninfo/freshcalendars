<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    /* Holidays year poster: weekends tinted, US holidays in red circles. Twelve months of six rows each, so every box is full and the dates read from across a room. */
    body { margin: 0; width: 1100px; height: 1420px; padding: 38px 44px 0; background: #fff; color: #14263d; font-family: Manrope, sans-serif; }
    header { height: 112px; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 14px; border-bottom: 6px solid #c22d16; margin-bottom: 20px; }
    h1 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 92px; line-height: .95; letter-spacing: -2px; color: #12365e; }
    .tag { font-family: Sora, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 2.5px; text-transform: uppercase; color:#fff;background:#c22d16;padding:9px 14px;border-radius:8px; margin-bottom: 6px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 26px; }
    .month {  }
    .month h2 { margin: 0; font-family: Sora, sans-serif; font-weight: 700; font-size: 23px; line-height: 36px; text-align: center; letter-spacing: .5px; color:#c22d16;border-bottom:3px solid #12365e; }
    .month table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .month th { height: 28px; font-family: Sora, sans-serif; font-weight: 700; font-size: 15px; color:#12365e; }
    .month td { height: 36px; padding: 0; text-align: center; font-size: 19px; font-weight: 700; line-height: 1; }
    .month td span { display: inline-block; min-width: 32px; line-height: 32px; border-radius: 50%; }
    .month td.we { background: #eef3f9; }
    .month th.we { color: #c22d16; }
    .month td.hol span { background: #c22d16; color: #fff; }
    footer { padding-top: 16px; font-size: 15px; letter-spacing: .5px; text-align: center; color: #42556c; }
  </style>
</head>
<body>
  <header>
    <h1>{{year}} Calendar</h1>
    <div class="tag">US Holidays</div>
  </header>
  <div class="grid">{{monthsHtml}}</div>
  <footer>freshcalendars.com</footer>
</body>
</html>
