<script>
/* Fresh Calendars Shop UI fixes: placeholders the template leaves empty, a label for the contact question, and a collapsible filter panel on phones. */
(function(){
  function run(){
    document.querySelectorAll('form[action$="/search"] input[name="q"]').forEach(function(i){ if(!i.placeholder) i.placeholder='Search planners, journals, pens…'; });
    document.querySelectorAll('footer input[type="email"]').forEach(function(i){ if(!i.placeholder) i.placeholder='Enter your email address'; });
    var bc=document.querySelector('nav[aria-label="Breadcrumb"] ol>li:last-child');
    if(bc && !bc.querySelector('a')) bc.setAttribute('aria-current','page');
    document.querySelectorAll('main form input:not([type=hidden]),main form textarea').forEach(function(i){ if(i.placeholder && !i.getAttribute('aria-label') && !(i.labels && i.labels.length)) i.setAttribute('aria-label', i.placeholder); });
    var a=document.getElementById('answer');
    if(a && !a.getAttribute('aria-label')){ var l=a.closest('div') && a.closest('div').querySelector('label'); a.setAttribute('aria-label', l ? l.textContent.trim() : 'Anti-spam question'); }
    /* The template prints brand logos with no alt (a logo-only link then has no name) and article card pictures with an empty one. */
    document.querySelectorAll('img[src*="/brand/images/"]:not([alt])').forEach(function(i){
      var n=(i.src.split('/').pop().split('?')[0].replace(/\.[a-z]+$/,'').replace(/-logo$/,'').split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(' '));
      i.alt=n ? n+' logo' : 'Brand logo';
    });
    document.querySelectorAll('article img[src*="/article/images/"]').forEach(function(i){
      if(i.getAttribute('alt')) return;
      var a=i.closest('a'), t=a && a.getAttribute('aria-label'), h=i.closest('article').querySelector('h3 a,h2 a,h3,h2');
      t=(t || (h && h.textContent) || '').replace(/\s+/g,' ').trim(); if(t) i.alt=t;
    });
    /* An article saved without a subtitle leaves an empty heading in the hero; every article has one now, this covers a miss. */
    document.querySelectorAll('h1+h2').forEach(function(h){ if(!h.textContent.trim() && !h.children.length) h.remove(); });
    var f=document.querySelector('form.fs-tag-filters');
    if(f && !document.querySelector('.fc-filter-toggle')){
      var b=document.createElement('button'); b.type='button'; b.className='fc-filter-toggle'; b.textContent='Filters';
      var active=f.querySelector('input:checked');
      b.setAttribute('aria-expanded', active ? 'true' : 'false');
      if(!active) f.classList.add('fc-collapsed');
      b.addEventListener('click',function(){ var open=f.classList.toggle('fc-collapsed'); b.setAttribute('aria-expanded', open ? 'false' : 'true'); });
      f.parentNode.insertBefore(b,f);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
})();
/* Product page: the shorter of the two columns stays in view while the longer one scrolls, so no blank column. */
(function(){
  var g=document.querySelector('.fs-pp-stack>.fs-pp-flat'); if(!g||!window.matchMedia) return;
  var mq=matchMedia('(min-width:1024px)');
  function fit(){
    var cols=[].slice.call(g.children).filter(function(c){return c.offsetHeight>0}); if(cols.length<2) return;
    cols.forEach(function(c){c.style.position='';c.style.top='';c.style.alignSelf=''});
    if(!mq.matches) return;
    var a=cols[0],b=cols[1],s=a.offsetHeight<b.offsetHeight?a:b,l=s===a?b:a;
    l.style.position='static';
    if(l.offsetHeight-s.offsetHeight<80) return;
    s.style.alignSelf='start'; s.style.position='sticky';
    s.style.top=Math.min(88,window.innerHeight-s.offsetHeight-24)+'px';
  }
  fit(); addEventListener('resize',fit); addEventListener('load',fit);
  if(window.ResizeObserver){var ro=new ResizeObserver(fit);[].slice.call(g.children).forEach(function(c){ro.observe(c)})}
})();
</script>
<script>
/* fc-promo: the suggestion card (styles in custom.css, section 20). On a product page (desktop only: phones
   already have the sticky buy bar) it repeats the page's own retailer button. On guides, categories and brand
   pages it lists three products from the homepage row "Trending Across the Shop", read from the homepage at
   that moment, so it never shows a stale list. Once per visit; closing it keeps it away for 7 days. */
(function(){
  var KEY='fcPromoClosed', DAY=864e5, shown=false, t0=Date.now();
  try{ if(Date.now()-(+localStorage.getItem(KEY)||0) < 7*DAY) return; if(sessionStorage.getItem('fcPromoShown')) return; }catch(e){}
  var path=location.pathname, isProduct=path.indexOf('/products/')===0;
  var ok=isProduct || /^\/(articles|categories|brands)\//.test(path);
  if(!ok) return;
  var phone=window.matchMedia && matchMedia('(max-width:640px)').matches;
  if(isProduct && phone) return;
  function ev(name,p){ try{ if(window.gtag) gtag('event',name,p||{}); }catch(e){} }
  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function mount(inner,kind){
    if(shown) return; shown=true;
    try{ sessionStorage.setItem('fcPromoShown','1'); }catch(e){}
    var b=document.createElement('aside'); b.className='fc-promo'; b.setAttribute('role','complementary'); b.setAttribute('aria-label','Suggested products');
    b.innerHTML='<button type="button" class="fc-promo__close" aria-label="Close suggestions">&times;</button>'+inner+'<p class="fc-promo__note">We earn a commission on purchases made through retailer links.</p>';
    document.body.appendChild(b);
    requestAnimationFrame(function(){ b.classList.add('is-in'); });
    function close(){ b.remove(); try{ localStorage.setItem(KEY,String(Date.now())); }catch(e){} document.removeEventListener('keydown',onKey); ev('promo_card_close',{kind:kind}); }
    function onKey(e){ if(e.key==='Escape') close(); }
    b.querySelector('.fc-promo__close').addEventListener('click',close);
    document.addEventListener('keydown',onKey);
    b.addEventListener('click',function(e){ var a=e.target.closest && e.target.closest('a'); if(a) ev('promo_card_click',{kind:kind,link_text:(a.textContent||'').trim().slice(0,60)}); });
    ev('promo_card_view',{kind:kind});
  }
  function forProduct(){
    var btn=document.querySelector('.fs-pp-offers a[data-fs-out]'), h=document.querySelector('h1');
    if(!btn||!h) return;
    var raw=(btn.textContent||'').replace(/\s+/g,' ').trim(), m=raw.match(/(\$[\d,.]+|Check price) at [A-Za-z.]+\s*$/); if(!m) return;   /* the offer row also holds "List price ..." and "Updated ..." */
    var label=m[0].trim(), was=raw.match(/List price (\$[\d,.]+)/);
    var crumbs=document.querySelectorAll('nav[aria-label="Breadcrumb"] a'), cat=crumbs.length?crumbs[crumbs.length-1]:null;
    var a=(was?'<p class="fc-promo__was">List price '+esc(was[1])+'</p>':'')+'<a class="fc-promo__buy" data-fs-out="'+esc(btn.getAttribute('data-fs-out'))+'" target="_blank" rel="'+esc(btn.getAttribute('rel')||'nofollow sponsored noopener')+'">'+esc(label)+'</a>';
    var more=cat?'<a class="fc-promo__more" href="'+esc(cat.getAttribute('href'))+'">Compare more '+esc((cat.textContent||'').trim().toLowerCase())+'</a>':'';
    mount('<p class="fc-promo__eyebrow">Still deciding?</p><p class="fc-promo__title">'+esc(h.textContent.trim())+'</p>'+a+more,'product');
  }
  function forList(){
    fetch('/',{credentials:'same-origin'}).then(function(r){ return r.ok?r.text():''; }).then(function(html){
      if(!html||shown) return;
      var doc=new DOMParser().parseFromString(html,'text/html'), sec=null;
      doc.querySelectorAll('section h2').forEach(function(x){ if(!sec && /Trending Across the Shop/i.test(x.textContent)) sec=x.closest('section'); });
      if(!sec) return;
      var items=[]; sec.querySelectorAll('.cr-card').forEach(function(c){
        var l=c.querySelector('h3 a[href^="/products/"]'), i=c.querySelector('img');
        if(l && i && items.length<(phone?2:3) && l.getAttribute('href')!==path) items.push('<li class="fc-promo__item"><a href="'+esc(l.getAttribute('href'))+'"><img src="'+esc(i.getAttribute('src'))+'" alt="" loading="lazy" width="56" height="56"><span>'+esc(l.textContent.replace(/\s+/g,' ').trim())+'</span></a></li>');
      });
      if(items.length<2) return;
      mount('<p class="fc-promo__eyebrow">From the shop</p><p class="fc-promo__title">Trending this week</p><ul class="fc-promo__list">'+items.join('')+'</ul>','trending');
    }).catch(function(){});
  }
  function fire(){ if(shown) return; var a=document.activeElement; if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; (isProduct?forProduct:forList)(); }
  function depth(){ var d=document.documentElement; return (scrollY+innerHeight)/Math.max(d.scrollHeight,1); }
  addEventListener('scroll',function(){ if(!shown && depth()>=.5 && Date.now()-t0>=20000) fire(); },{passive:true});
  setTimeout(function(){ if(!shown && depth()>=.5) fire(); },20500);
  document.addEventListener('mouseout',function(e){ if(!shown && !e.relatedTarget && e.clientY<=0 && Date.now()-t0>=8000) fire(); });
})();
</script>
<script>
/* Product page: the main picture opens the retailer, the same way the "Where to buy" button does (Clarity,
   Nov. 24, 2026: the picture was the most tapped element on phones and did nothing). It presses the page's own
   retailer link, so the click is counted and tagged like any other. No retailer link (out of stock): no change. */
(function(){
  var plate=document.querySelector('.fs-pp-plate'); if(!plate) return;
  function link(){ return document.querySelector('.fs-pp-offers a.fs-al[data-url]'); }
  function go(){ var l=link(); if(l) l.click(); }
  function arm(){
    var a=link(); if(!a || plate.classList.contains('fc-plate-go')) return !!a;
    var img=a.querySelector('img[alt]'), name=(img && img.alt.trim()) || 'the retailer';
    plate.classList.add('fc-plate-go'); plate.setAttribute('role','link'); plate.tabIndex=0;
    plate.setAttribute('aria-label','See it at '+name+' (opens the retailer in a new tab)');
    var t=document.createElement('span'); t.className='fc-plate-go__tag'; t.setAttribute('aria-hidden','true'); t.textContent='See it at '+name+' \u203a';
    plate.appendChild(t);
    plate.addEventListener('click',go);
    plate.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } });
    return true;
  }
  var n=0; (function wait(){ if(arm() || ++n>20) return; setTimeout(wait,500); })();
})();
</script>
<script>
/* fc-instock: a product whose retailer shows no price (usually out of stock) still gets visits. Under its
   retailer button this lists up to three items from the page's own "You might also like" row that do show a
   price, so the visit is not a dead end. Nothing is added when the product has a price. */
(function(){
  var offers=document.querySelector('.fs-pp-offers'); if(!offers) return;
  function build(){
    /* The retailer row first renders as a placeholder with no price and fills in later, so the page's own
       price line decides: it is in the first HTML and reads "Click for Price" when there is none. */
    var line=document.querySelector('.fs-pp-price'), a=offers.querySelector('a.fs-al[data-url]');
    if(!line || /\$\s?\d/.test(line.textContent)) return true;
    if(!a) return false;
    if(a.getAttribute('data-price') || document.querySelector('.fc-instock')) return true;
    var img=a.querySelector('img[alt]'), name=(img && img.alt.trim()) || 'the retailer', items=[];
    document.querySelectorAll('.cr-card').forEach(function(c){
      if(items.length>=3 || c.closest('.fs-pp-inset')) return;
      var l=c.querySelector('h3 a[href*="/products/"]'), p=c.querySelector('[data-fs-price-type="actual"]'), i=c.querySelector('img');
      var price=p && (p.textContent.match(/\$[\d,]+(\.\d\d)?/)||[])[0];
      if(l && price && i) items.push({href:l.getAttribute('href'), title:l.textContent.replace(/\s+/g,' ').trim(), price:price, src:i.currentSrc||i.src});
    });
    if(!items.length) return false;
    var box=document.createElement('aside'); box.className='fc-instock'; box.setAttribute('aria-label','Similar items with a price today');
    var n=document.createElement('p'); n.className='fc-instock__note';
    n.textContent=name+' showed no price for this item when we last checked, which usually means it is out of stock. Similar items with a price today:';
    var ul=document.createElement('ul');
    items.forEach(function(it){
      var li=document.createElement('li'), l=document.createElement('a'), im=document.createElement('img'), t=document.createElement('span'), pr=document.createElement('span');
      l.href=it.href; im.src=it.src; im.alt=''; im.loading='lazy'; im.width=48; im.height=48; t.textContent=it.title; pr.className='fc-instock__price'; pr.textContent=it.price;
      l.appendChild(im); l.appendChild(t); l.appendChild(pr); li.appendChild(l); ul.appendChild(li);
    });
    box.appendChild(n); box.appendChild(ul); offers.parentNode.insertBefore(box, offers.nextSibling);
    return true;
  }
  var k=0; function wait(){ if(build() || ++k>20) return; setTimeout(wait,500); }
  if(document.readyState==='complete') setTimeout(wait,1200); else addEventListener('load',function(){ setTimeout(wait,1200); });
})();
</script>
