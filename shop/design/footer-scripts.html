<script>
/* Fresh Calendars Shop UI fixes: placeholders the template leaves empty, a label for the contact question, and a collapsible filter panel on phones. */
(function(){
  function run(){
    document.querySelectorAll('form[action$="/search"] input[name="q"]').forEach(function(i){ if(!i.placeholder) i.placeholder='Search planners, journals, pens…'; });
    document.querySelectorAll('footer input[type="email"]').forEach(function(i){ if(!i.placeholder) i.placeholder='Enter your email address'; });
    var bc=document.querySelector('nav[aria-label="Breadcrumb"] ol>li:last-child');
    if(bc && !bc.querySelector('a')) bc.setAttribute('aria-current','page');
    document.querySelectorAll('main form input:not([type=hidden]),main form textarea').forEach(function(i){ if(i.placeholder && !i.getAttribute('aria-label') && !(i.labels && i.labels.length)) i.setAttribute('aria-label', i.placeholder); });
    var a=document.getElementById('answer');
    if(a && !a.getAttribute('aria-label')){ var l=a.closest('div') && a.closest('div').querySelector('label'); a.setAttribute('aria-label', l ? l.textContent.trim() : 'Anti-spam question'); }
    var f=document.querySelector('form.fs-tag-filters');
    if(f && !document.querySelector('.fc-filter-toggle')){
      var b=document.createElement('button'); b.type='button'; b.className='fc-filter-toggle'; b.textContent='Filters';
      var active=f.querySelector('input:checked');
      b.setAttribute('aria-expanded', active ? 'true' : 'false');
      if(!active) f.classList.add('fc-collapsed');
      b.addEventListener('click',function(){ var open=f.classList.toggle('fc-collapsed'); b.setAttribute('aria-expanded', open ? 'false' : 'true'); });
      f.parentNode.insertBefore(b,f);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
})();
/* Product page: the shorter of the two columns stays in view while the longer one scrolls, so no blank column. */
(function(){
  var g=document.querySelector('.fs-pp-stack>.fs-pp-flat'); if(!g||!window.matchMedia) return;
  var mq=matchMedia('(min-width:1024px)');
  function fit(){
    var cols=[].slice.call(g.children).filter(function(c){return c.offsetHeight>0}); if(cols.length<2) return;
    cols.forEach(function(c){c.style.position='';c.style.top='';c.style.alignSelf=''});
    if(!mq.matches) return;
    var a=cols[0],b=cols[1],s=a.offsetHeight<b.offsetHeight?a:b,l=s===a?b:a;
    l.style.position='static';
    if(l.offsetHeight-s.offsetHeight<80) return;
    s.style.alignSelf='start'; s.style.position='sticky';
    s.style.top=Math.min(88,window.innerHeight-s.offsetHeight-24)+'px';
  }
  fit(); addEventListener('resize',fit); addEventListener('load',fit);
  if(window.ResizeObserver){var ro=new ResizeObserver(fit);[].slice.call(g.children).forEach(function(c){ro.observe(c)})}
})();
</script>
